<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#2a3a40" />
<meta name="description" content="Happy Birthday, Terry Timm — Love, AM, M & V." />
<meta property="og:title" content="Happy Birthday, Terry Timm!" />
<title>Happy Birthday, Terry Timm!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%88%E2%80%8D%E2%96%ABx%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
:root {
  --ink: #1c2428;
  --muted: #3a454c;
  --basil: #2f5d3a;
  --cream: #fffaf4;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --display: "Fraunces", Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body {
  margin: 0;
  min-height: 100dvh;
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  background: #1e2a30;
}
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}
.bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 52% 35%;
  display: block;
}
.bg-overlay {
  position: absolute;
  inset: 0;
  /* light wash only — photo stays clear */
  background: linear-gradient(180deg, rgba(10,16,20,0.18) 0%, rgba(10,16,20,0.08) 45%, rgba(10,16,20,0.28) 100%);
}
.app {
  position: relative;
  z-index: 1;
  min-height: 100dvh;
  max-width: 26rem;
  margin: 0 auto;
  padding: calc(1.25rem + var(--safe-t)) 1rem calc(1.1rem + var(--safe-b));
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 0.65rem;
}
.panel {
  background: rgba(255, 250, 244, 0.78);
  backdrop-filter: blur(14px) saturate(1.1);
  -webkit-backdrop-filter: blur(14px) saturate(1.1);
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 1.25rem;
  padding: 1.35rem 1.2rem 1.15rem;
  text-align: center;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.22);
}
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(1.85rem, 7.2vw, 2.25rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin: 0 0 0.75rem;
  color: var(--ink);
  text-shadow: 0 1px 0 rgba(255,255,255,0.4);
}
h1 .name {
  display: block;
  color: #2f5d3a;
  margin-top: 0.1rem;
}
.msg {
  font-size: 1.05rem;
  line-height: 1.5;
  color: var(--muted);
  margin: 0 auto 0.95rem;
  max-width: 28ch;
}
.from {
  font-family: var(--display);
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 1rem;
}
.cat-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
}
.cat-btn {
  width: 5.4rem;
  height: 5.4rem;
  border-radius: 999px;
  border: 2px solid rgba(28, 36, 40, 0.15);
  background: radial-gradient(circle at 40% 30%, #fff, #f0ebe6 60%, #e4ddd4);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  transition: transform 0.12s ease;
}
.cat-btn:active { transform: scale(0.94); }
.cat-btn:focus-visible { outline: 3px solid var(--basil); outline-offset: 3px; }
.cat-btn svg { width: 3.5rem; height: 3.5rem; display: block; }
.cat-hint {
  font-size: 0.78rem;
  color: var(--basil);
  font-weight: 600;
  margin: 0;
  line-height: 1.3;
  max-width: 16rem;
}
.credit {
  text-align: center;
  font-size: 0.62rem;
  line-height: 1.35;
  color: rgba(255, 255, 255, 0.92);
  margin: 0;
  text-shadow: 0 1px 4px rgba(0,0,0,0.65);
}
.credit a {
  color: #fff;
  text-decoration: underline;
  text-underline-offset: 2px;
}
#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 50;
}
.leaf, .speck {
  position: absolute;
  top: 0;
  left: 0;
  will-change: transform, opacity;
  animation: shoot linear forwards;
}
.leaf {
  font-size: 1.15rem;
  line-height: 1;
  filter: drop-shadow(0 1px 1px rgba(40, 70, 40, 0.25));
}
.speck { width: 6px; height: 6px; border-radius: 50%; }
@keyframes shoot {
  0% { transform: translate3d(0,0,0) rotate(0deg) scale(0.6); opacity: 1; }
  100% { transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--rot)) scale(1); opacity: 0; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <img
    src="assets/palisades.jpg"
    srcset="assets/palisades-2560.jpg 2560w, assets/palisades.jpg 3200w"
    sizes="250vw"
    width="3200"
    height="2112"
    alt=""
    decoding="async"
    fetchpriority="high"
  />
  <div class="bg-overlay"></div>
</div>
<div class="app">
  <article class="panel" aria-label="Birthday card for Terry Timm">
    <h1>Happy Birthday,<span class="name">Terry Timm!</span></h1>
    <p class="msg">Hope you have the best day, Terry! We truly appreciate everything you do for us and for so many others.</p>
    <p class="from">Love, AM, M &amp; V</p>
    <div class="cat-wrap">
      <button class="cat-btn" id="cat" type="button" aria-label="Tap the tuxedo cat for basil confetti">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <ellipse cx="32" cy="38" rx="18" ry="16" fill="#1a1a1a"/>
          <ellipse cx="32" cy="42" rx="10" ry="11" fill="#f5f5f5"/>
          <circle cx="32" cy="22" r="14" fill="#1a1a1a"/>
          <path d="M20 14 L18 4 L28 12 Z" fill="#1a1a1a"/>
          <path d="M44 14 L46 4 L36 12 Z" fill="#1a1a1a"/>
          <path d="M21.5 13 L20 7 L27 12 Z" fill="#2a2a2a"/>
          <path d="M42.5 13 L44 7 L37 12 Z" fill="#2a2a2a"/>
          <ellipse cx="32" cy="26" rx="7" ry="6" fill="#f5f5f5"/>
          <ellipse cx="26.5" cy="21" rx="2.2" ry="2.6" fill="#f0e68c"/>
          <ellipse cx="37.5" cy="21" rx="2.2" ry="2.6" fill="#f0e68c"/>
          <circle cx="26.5" cy="21.3" r="1" fill="#111"/>
          <circle cx="37.5" cy="21.3" r="1" fill="#111"/>
          <ellipse cx="32" cy="25.5" rx="1.6" ry="1.2" fill="#e89aa8"/>
          <path d="M32 26.5 Q28 29 26 28" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
          <path d="M32 26.5 Q36 29 38 28" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
          <ellipse cx="24" cy="50" rx="4" ry="2.5" fill="#f5f5f5"/>
          <ellipse cx="40" cy="50" rx="4" ry="2.5" fill="#f5f5f5"/>
        </svg>
      </button>
      <p class="cat-hint">Tap the tuxedo cat for basil confetti</p>
    </div>
  </article>
  <p class="credit">
    Photo: <a href="https://commons.wikimedia.org/wiki/User:Beyond_My_Ken" rel="noopener">Beyond My Ken</a>
    — Hudson River Palisades from Alpine Boat Basin /
    <a href="https://commons.wikimedia.org/wiki/File:Hudson_River_Palisades_from_Alpine_Boat_Basin_in_fall_2.jpg" rel="noopener">Wikimedia Commons</a>
    (<a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="noopener">CC BY-SA 4.0</a>)
  </p>
</div>
<div id="confetti" aria-hidden="true"></div>
<script>
(function () {
  const layer = document.getElementById('confetti');
  const cat = document.getElementById('cat');
  const pesto = ['#4a7c59', '#6b9e4a', '#3d6b4f', '#8fbc6b', '#2f5d3a'];
  function origin() {
    const r = cat.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  function shoot() {
    const o = origin();
    for (let i = 0; i < 36; i++) {
      const isLeaf = Math.random() > 0.35;
      const el = document.createElement(isLeaf ? 'span' : 'i');
      el.className = isLeaf ? 'leaf' : 'speck';
      if (isLeaf) {
        el.textContent = '🌿';
        el.style.fontSize = (0.85 + Math.random() * 0.7) + 'rem';
      } else {
        el.style.background = pesto[i % pesto.length];
        const s = 4 + Math.random() * 5;
        el.style.width = s + 'px';
        el.style.height = s + 'px';
      }
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.35;
      const dist = 120 + Math.random() * 220;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 40 - Math.random() * 80;
      const dur = 0.9 + Math.random() * 0.9;
      el.style.left = o.x + 'px';
      el.style.top = o.y + 'px';
      el.style.setProperty('--dx', dx + 'px');
      el.style.setProperty('--dy', dy + 'px');
      el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      el.style.animationDuration = dur + 's';
      layer.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 60);
    }
  }
  cat.addEventListener('click', (e) => { e.stopPropagation(); shoot(); });
})();
</script>
</body>
</html>
