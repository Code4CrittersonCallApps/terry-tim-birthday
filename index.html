<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#2a221c" />
<meta name="description" content="Happy Birthday, Terry Timm — From AM, M & V." />
<meta property="og:title" content="Happy Birthday, Terry Timm!" />
<title>Happy Birthday, Terry Timm!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%88%E2%80%8D%E2%96%ABx%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
<style>
:root {
  --rose: #d4788a;
  --peach: #e8b89a;
  --cream: #faf3ea;
  --ink: #3a2e28;
  --muted: #8a7568;
  --card: #fff8f1;
  --gold: #c9a06a;
  --sage: #8fad96;
  --basil: #4a7c59;
  --pesto: #6b9e4a;
  --bg1: #f6ebe0;
  --bg2: #efe0d2;
  --radius: 1.35rem;
  --max: 26rem;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --display: "Fraunces", Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body {
  margin: 0;
  min-height: 100dvh;
  background: var(--bg1);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body {
  background:
    radial-gradient(120% 70% at 50% -8%, rgba(232, 184, 154, 0.55), transparent 55%),
    radial-gradient(90% 55% at 0% 100%, rgba(212, 120, 138, 0.18), transparent 50%),
    radial-gradient(80% 50% at 100% 90%, rgba(143, 173, 150, 0.22), transparent 45%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
}
.app {
  min-height: 100dvh;
  max-width: var(--max);
  margin: 0 auto;
  padding: calc(1.35rem + var(--safe-t)) 1.15rem calc(1.6rem + var(--safe-b));
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: center;
  gap: 0.85rem;
  position: relative;
}
.card {
  position: relative;
  background: linear-gradient(165deg, #fffaf4 0%, var(--card) 55%, #f8ebe0 100%);
  border: 1px solid rgba(201, 160, 106, 0.35);
  border-radius: var(--radius);
  padding: 1.7rem 1.3rem 1.45rem;
  box-shadow:
    0 16px 40px rgba(90, 60, 40, 0.12),
    inset 0 1px 0 rgba(255, 255, 255, 0.8);
  overflow: hidden;
  text-align: center;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 5px;
  background: linear-gradient(90deg, var(--sage), var(--peach), var(--rose), var(--gold));
}
.critters {
  display: flex;
  justify-content: center;
  gap: 0.4rem;
  font-size: 1.7rem;
  margin-bottom: 0.7rem;
  line-height: 1;
  filter: drop-shadow(0 3px 6px rgba(90, 60, 40, 0.12));
}
.critters span {
  display: inline-block;
  animation: bob 3.2s ease-in-out infinite;
}
.critters span:nth-child(2) { animation-delay: 0.3s; }
.critters span:nth-child(3) { animation-delay: 0.6s; }
.critters span:nth-child(4) { animation-delay: 0.9s; }
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
.eyebrow {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--rose);
  margin: 0 0 0.5rem;
}
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(1.9rem, 7.8vw, 2.4rem);
  line-height: 1.15;
  letter-spacing: -0.02em;
  margin: 0 0 1rem;
  color: var(--ink);
}
h1 .name {
  display: block;
  background: linear-gradient(120deg, #c45c6a, #d4788a 45%, #c9a06a);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-top: 0.12rem;
}
.msg {
  font-size: 1.12rem;
  line-height: 1.55;
  color: var(--muted);
  margin: 0 auto 0.35rem;
  max-width: 28ch;
}
.msg + .msg { margin-bottom: 1.15rem; }
.from {
  font-size: 1.05rem;
  color: var(--ink);
  font-weight: 600;
  margin: 0 0 1.1rem;
  font-family: var(--display);
}
.cat-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.45rem;
  margin-top: 0.25rem;
}
.cat-btn {
  width: 5.6rem;
  height: 5.6rem;
  border-radius: 999px;
  border: 2px solid rgba(58, 46, 40, 0.18);
  background: radial-gradient(circle at 40% 30%, #fff, #f0ebe6 60%, #e4ddd4);
  box-shadow: 0 8px 20px rgba(90, 60, 40, 0.16);
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  transition: transform 0.12s ease;
  position: relative;
}
.cat-btn:active { transform: scale(0.94); }
.cat-btn:focus-visible { outline: 3px solid var(--basil); outline-offset: 3px; }
.cat-btn svg { width: 3.6rem; height: 3.6rem; display: block; }
.cat-hint {
  font-size: 0.78rem;
  color: var(--basil);
  font-weight: 600;
  margin: 0;
}
.hint {
  text-align: center;
  font-size: 0.75rem;
  color: var(--muted);
  margin: 0;
  opacity: 0.9;
}
#confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 50;
}
.leaf {
  position: absolute;
  top: 0;
  left: 0;
  font-size: 1.15rem;
  line-height: 1;
  will-change: transform, opacity;
  animation: shoot linear forwards;
  filter: drop-shadow(0 1px 1px rgba(40, 70, 40, 0.25));
}
.speck {
  position: absolute;
  top: 0;
  left: 0;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  will-change: transform, opacity;
  animation: shoot linear forwards;
}
@keyframes shoot {
  0% {
    transform: translate3d(0, 0, 0) rotate(0deg) scale(0.6);
    opacity: 1;
  }
  100% {
    transform: translate3d(var(--dx), var(--dy), 0) rotate(var(--rot)) scale(1);
    opacity: 0;
  }
}
</style>
</head>
<body>
<div class="app">
  <article class="card" id="card" aria-label="Birthday card for Terry Timm">
    <div class="critters" aria-hidden="true">
      <span>🐐</span><span>🦆</span><span>🐰</span><span>🐕</span>
    </div>
    <p class="eyebrow">With all our hearts</p>
    <h1>Happy Birthday,<span class="name">Terry Timm!</span></h1>
    <p class="msg">Hope you have a great day!</p>
    <p class="msg">We appreciate all you do for us and others.</p>
    <p class="from">From AM, M &amp; V</p>
    <div class="cat-wrap">
      <button class="cat-btn" id="cat" type="button" aria-label="Tap the tuxedo cat for basil confetti">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <!-- tuxedo cat: black body, white chest/muzzle -->
          <ellipse cx="32" cy="38" rx="18" ry="16" fill="#1a1a1a"/>
          <ellipse cx="32" cy="42" rx="10" ry="11" fill="#f5f5f5"/>
          <!-- head -->
          <circle cx="32" cy="22" r="14" fill="#1a1a1a"/>
          <!-- ears -->
          <path d="M20 14 L18 4 L28 12 Z" fill="#1a1a1a"/>
          <path d="M44 14 L46 4 L36 12 Z" fill="#1a1a1a"/>
          <path d="M21.5 13 L20 7 L27 12 Z" fill="#2a2a2a"/>
          <path d="M42.5 13 L44 7 L37 12 Z" fill="#2a2a2a"/>
          <!-- white muzzle blaze -->
          <ellipse cx="32" cy="26" rx="7" ry="6" fill="#f5f5f5"/>
          <!-- eyes -->
          <ellipse cx="26.5" cy="21" rx="2.2" ry="2.6" fill="#f0e68c"/>
          <ellipse cx="37.5" cy="21" rx="2.2" ry="2.6" fill="#f0e68c"/>
          <circle cx="26.5" cy="21.3" r="1" fill="#111"/>
          <circle cx="37.5" cy="21.3" r="1" fill="#111"/>
          <!-- nose + mouth -->
          <ellipse cx="32" cy="25.5" rx="1.6" ry="1.2" fill="#e89aa8"/>
          <path d="M32 26.5 Q28 29 26 28" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
          <path d="M32 26.5 Q36 29 38 28" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
          <!-- white paws hint -->
          <ellipse cx="24" cy="50" rx="4" ry="2.5" fill="#f5f5f5"/>
          <ellipse cx="40" cy="50" rx="4" ry="2.5" fill="#f5f5f5"/>
        </svg>
      </button>
      <p class="cat-hint">🌿 tap the tuxedo cat</p>
    </div>
  </article>
  <p class="hint">Made just for you, with love.</p>
</div>
<div id="confetti" aria-hidden="true"></div>
<script>
(function () {
  const layer = document.getElementById('confetti');
  const cat = document.getElementById('cat');
  const pesto = ['#4a7c59', '#6b9e4a', '#3d6b4f', '#8fbc6b', '#2f5d3a'];

  function origin() {
    const r = cat.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function shoot() {
    const o = origin();
    const n = 36;
    for (let i = 0; i < n; i++) {
      const isLeaf = Math.random() > 0.35;
      const el = document.createElement(isLeaf ? 'span' : 'i');
      el.className = isLeaf ? 'leaf' : 'speck';
      if (isLeaf) {
        el.textContent = '🌿';
        el.style.fontSize = (0.85 + Math.random() * 0.7) + 'rem';
      } else {
        el.style.background = pesto[i % pesto.length];
        const s = 4 + Math.random() * 5;
        el.style.width = s + 'px';
        el.style.height = s + 'px';
      }
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.35;
      const dist = 120 + Math.random() * 220;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 40 - Math.random() * 80;
      const dur = 0.9 + Math.random() * 0.9;
      el.style.left = o.x + 'px';
      el.style.top = o.y + 'px';
      el.style.setProperty('--dx', dx + 'px');
      el.style.setProperty('--dy', dy + 'px');
      el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      el.style.animationDuration = dur + 's';
      layer.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 60);
    }
  }

  cat.addEventListener('click', (e) => {
    e.stopPropagation();
    shoot();
  });
})();
</script>
</body>
</html>
